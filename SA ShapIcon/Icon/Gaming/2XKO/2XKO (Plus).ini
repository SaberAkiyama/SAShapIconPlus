[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SI2XKO | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#CLI Arguments.inc
@include4=#@#Plus\Measures\Action Timer Icon.inc
@include5=#@#Plus\Gradient Shape Style.inc
@include6=#@#Plus\Mask Shape Style.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#2XKOShape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | #2XKOShapeGradient1Base#,#ShapeAlphaMask# ; 1.0 | #2XKOShapeGradient2Base#,#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#2XKOMaskMeter#
MeterStyle=FaderShapeActions | Mask#2XKOMaskStyle##IconHeight#
Group=Faders
Hidden=#2XKORegularHidden#
MyMaskFillColor=Fill Color #2XKOMaskBase#,#ShapeAlphaIcon#
ImageTint=#2XKOMaskBase#
ImageAlpha=#ShapeAlphaIcon#

[2XKO]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\2XKO.png
ImageTint=#2XKOMaskBase#
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#2XKOURL#"#2XKOCLI#]
AntiAlias=1
UpdateDivider=-1
