[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SIAniimo | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#CLI Arguments.inc
@include4=#@#Plus\Measures\Action Timer Icon.inc
@include5=#@#Plus\Gradient Shape Style.inc
@include6=#@#Plus\Mask Shape Style.inc
@include7=#@#Plus\Chameleon.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#AniimoShape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | [Desktop#AniimoShapeGradient1ChCode#],#ShapeAlphaMask# ; 1.0 | [Desktop#AniimoShapeGradient2ChCode#],#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#AniimoMaskMeter#
MeterStyle=FaderShapeActions | Mask#AniimoMaskStyle##IconHeight#
Group=Faders
Hidden=#AniimoRegularHidden#
MyMaskFillColor=Fill Color [Desktop#AniimoMaskChCode#],#ShapeAlphaIcon#
ImageTint=[Desktop#AniimoMaskChCode#]
ImageAlpha=#ShapeAlphaIcon#

[Aniimo]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\Aniimo.png
ImageTint=[Desktop#AniimoMaskChCode#]
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#AniimoURL#"#AniimoCLI#]
AntiAlias=1
UpdateDivider=-1
