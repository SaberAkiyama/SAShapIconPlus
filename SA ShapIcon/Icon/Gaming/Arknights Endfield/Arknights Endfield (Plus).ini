[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SIArknightsEndfield | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#CLI Arguments.inc
@include4=#@#Plus\Measures\Action Timer Icon.inc
@include5=#@#Plus\Gradient Shape Style.inc
@include6=#@#Plus\Mask Shape Style.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#ArknightsEndfieldShape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | #ArknightsEndfieldShapeGradient1Base#,#ShapeAlphaMask# ; 1.0 | #ArknightsEndfieldShapeGradient2Base#,#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#ArknightsEndfieldMaskMeter#
MeterStyle=FaderShapeActions | Mask#ArknightsEndfieldMaskStyle##IconHeight#
Group=Faders
Hidden=#ArknightsEndfieldRegularHidden#
MyMaskFillColor=Fill Color #ArknightsEndfieldMaskBase#,#ShapeAlphaIcon#
ImageTint=#ArknightsEndfieldMaskBase#
ImageAlpha=#ShapeAlphaIcon#

[ArknightsEndfield]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\Arknights Endfield.png
ImageTint=#ArknightsEndfieldMaskBase#
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#ArknightsEndfieldURL#"#ArknightsEndfieldCLI#]
AntiAlias=1
UpdateDivider=-1
