[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SICodeVein2 | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#CLI Arguments.inc
@include4=#@#Plus\Measures\Action Timer Icon.inc
@include5=#@#Plus\Gradient Shape Style.inc
@include6=#@#Plus\Mask Shape Style.inc
@include7=#@#Plus\Chameleon.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#CodeVein2Shape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | [Desktop#CodeVein2ShapeGradient1ChCode#],#ShapeAlphaMask# ; 1.0 | [Desktop#CodeVein2ShapeGradient2ChCode#],#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#CodeVein2MaskMeter#
MeterStyle=FaderShapeActions | Mask#CodeVein2MaskStyle##IconHeight#
Group=Faders
Hidden=#CodeVein2RegularHidden#
MyMaskFillColor=Fill Color [Desktop#CodeVein2MaskChCode#],#ShapeAlphaIcon#
ImageTint=[Desktop#CodeVein2MaskChCode#]
ImageAlpha=#ShapeAlphaIcon#

[CodeVein2]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\Code Vein II.png
ImageTint=[Desktop#CodeVein2MaskChCode#]
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#CodeVein2URL#"#CodeVein2CLI#]
AntiAlias=1
UpdateDivider=-1
