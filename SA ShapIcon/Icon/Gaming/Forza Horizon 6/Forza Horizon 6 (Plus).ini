[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SIFH6 | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#CLI Arguments.inc
@include4=#@#Plus\Measures\Action Timer Icon.inc
@include5=#@#Plus\Gradient Shape Style.inc
@include6=#@#Plus\Mask Shape Style.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#FH6Shape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | #FH6ShapeGradient1Base#,#ShapeAlphaMask# ; 1.0 | #FH6ShapeGradient2Base#,#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#FH6MaskMeter#
MeterStyle=FaderShapeActions | Mask#FH6MaskStyle##IconHeight#
Group=Faders
Hidden=#FH6RegularHidden#
MyMaskFillColor=Fill Color #FH6MaskBase#,#ShapeAlphaIcon#
ImageTint=#FH6MaskBase#
ImageAlpha=#ShapeAlphaIcon#

[FH6]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\Forza Horizon 6.png
ImageTint=#FH6MaskBase#
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#FH6URL#"#FH6CLI#]
AntiAlias=1
UpdateDivider=-1
