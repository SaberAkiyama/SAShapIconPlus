[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SIInvincibleVS | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#CLI Arguments.inc
@include4=#@#Plus\Measures\Action Timer Icon.inc
@include5=#@#Plus\Gradient Shape Style.inc
@include6=#@#Plus\Mask Shape Style.inc
@include7=#@#Plus\Chameleon.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#InvincibleVSShape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | [Desktop#InvincibleVSShapeGradient1ChCode#],#ShapeAlphaMask# ; 1.0 | [Desktop#InvincibleVSShapeGradient2ChCode#],#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#InvincibleVSMaskMeter#
MeterStyle=FaderShapeActions | Mask#InvincibleVSMaskStyle##IconHeight#
Group=Faders
Hidden=#InvincibleVSRegularHidden#
MyMaskFillColor=Fill Color [Desktop#InvincibleVSMaskChCode#],#ShapeAlphaIcon#
ImageTint=[Desktop#InvincibleVSMaskChCode#]
ImageAlpha=#ShapeAlphaIcon#

[InvincibleVS]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\Invincible VS.png
ImageTint=[Desktop#InvincibleVSMaskChCode#]
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#InvincibleVSURL#"#InvincibleVSCLI#]
AntiAlias=1
UpdateDivider=-1
