[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SIMSD | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#CLI Arguments.inc
@include4=#@#Plus\Measures\Action Timer Icon.inc
@include5=#@#Plus\Gradient Shape Style.inc
@include6=#@#Plus\Mask Shape Style.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#MSDShape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | #MSDShapeGradient1Base#,#ShapeAlphaMask# ; 1.0 | #MSDShapeGradient2Base#,#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#MSDMaskMeter#
MeterStyle=FaderShapeActions | Mask#MSDMaskStyle##IconHeight#
Group=Faders
Hidden=#MSDRegularHidden#
MyMaskFillColor=Fill Color #MSDMaskBase#,#ShapeAlphaIcon#
ImageTint=#MSDMaskBase#
ImageAlpha=#ShapeAlphaIcon#

[MSD]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\MONGIL Star Dive.png
ImageTint=#MSDMaskBase#
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#MSDURL#"#MSDCLI#]
AntiAlias=1
UpdateDivider=-1
