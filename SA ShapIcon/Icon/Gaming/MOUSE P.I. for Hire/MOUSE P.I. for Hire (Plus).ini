[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SIMousePIFH | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#CLI Arguments.inc
@include4=#@#Plus\Measures\Action Timer Icon.inc
@include5=#@#Plus\Gradient Shape Style.inc
@include6=#@#Plus\Mask Shape Style.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#MousePIFHShape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | #MousePIFHShapeGradient1Base#,#ShapeAlphaMask# ; 1.0 | #MousePIFHShapeGradient2Base#,#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#MousePIFHMaskMeter#
MeterStyle=FaderShapeActions | Mask#MousePIFHMaskStyle##IconHeight#
Group=Faders
Hidden=#MousePIFHRegularHidden#
MyMaskFillColor=Fill Color #MousePIFHMaskBase#,#ShapeAlphaIcon#
ImageTint=#MousePIFHMaskBase#
ImageAlpha=#ShapeAlphaIcon#

[MousePIFH]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\MOUSE P.I. for Hire.png
ImageTint=#MousePIFHMaskBase#
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#MousePIFHURL#"#MousePIFHCLI#]
AntiAlias=1
UpdateDivider=-1
