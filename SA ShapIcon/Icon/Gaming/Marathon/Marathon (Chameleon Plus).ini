[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SIMarathon | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#CLI Arguments.inc
@include4=#@#Plus\Measures\Action Timer Icon.inc
@include5=#@#Plus\Gradient Shape Style.inc
@include6=#@#Plus\Mask Shape Style.inc
@include7=#@#Plus\Chameleon.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#MarathonShape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | [Desktop#MarathonShapeGradient1ChCode#],#ShapeAlphaMask# ; 1.0 | [Desktop#MarathonShapeGradient2ChCode#],#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#MarathonMaskMeter#
MeterStyle=FaderShapeActions | Mask#MarathonMaskStyle##IconHeight#
Group=Faders
Hidden=#MarathonRegularHidden#
MyMaskFillColor=Fill Color [Desktop#MarathonMaskChCode#],#ShapeAlphaIcon#
ImageTint=[Desktop#MarathonMaskChCode#]
ImageAlpha=#ShapeAlphaIcon#

[Marathon]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\Marathon.png
ImageTint=[Desktop#MarathonMaskChCode#]
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#MarathonURL#"#MarathonCLI#]
AntiAlias=1
UpdateDivider=-1
