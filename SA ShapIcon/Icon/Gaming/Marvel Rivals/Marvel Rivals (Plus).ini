[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SIMarvelRivals | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#CLI Arguments.inc
@include4=#@#Plus\Measures\Action Timer Icon.inc
@include5=#@#Plus\Gradient Shape Style.inc
@include6=#@#Plus\Mask Shape Style.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#MarvelRivalsShape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | #MarvelRivalsShapeGradient1Base#,#ShapeAlphaMask# ; 1.0 | #MarvelRivalsShapeGradient2Base#,#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#MarvelRivalsMaskMeter#
MeterStyle=FaderShapeActions | Mask#MarvelRivalsMaskStyle##IconHeight#
Group=Faders
Hidden=#MarvelRivalsRegularHidden#
MyMaskFillColor=Fill Color #MarvelRivalsMaskBase#,#ShapeAlphaIcon#
ImageTint=#MarvelRivalsMaskBase#
ImageAlpha=#ShapeAlphaIcon#

[MarvelRivals]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\Marvel Rivals.png
ImageTint=#MarvelRivalsMaskBase#
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#MarvelRivalsURL#"#MarvelRivalsCLI#]
AntiAlias=1
UpdateDivider=-1
