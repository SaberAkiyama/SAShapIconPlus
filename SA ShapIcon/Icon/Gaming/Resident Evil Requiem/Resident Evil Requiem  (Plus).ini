[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SIRERequiem | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#CLI Arguments.inc
@include4=#@#Plus\Measures\Action Timer Icon.inc
@include5=#@#Plus\Gradient Shape Style.inc
@include6=#@#Plus\Mask Shape Style.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#RERequiemShape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | #RERequiemShapeGradient1Base#,#ShapeAlphaMask# ; 1.0 | #RERequiemShapeGradient2Base#,#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#RERequiemMaskMeter#
MeterStyle=FaderShapeActions | Mask#RERequiemMaskStyle##IconHeight#
Group=Faders
Hidden=#RERequiemRegularHidden#
MyMaskFillColor=Fill Color #RERequiemMaskBase#,#ShapeAlphaIcon#
ImageTint=#RERequiemMaskBase#
ImageAlpha=#ShapeAlphaIcon#

[RERequiem]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\Resident Evil Requiem.png
ImageTint=#RERequiemMaskBase#
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#RERequiemURL#"#RERequiemCLI#]
AntiAlias=1
UpdateDivider=-1
