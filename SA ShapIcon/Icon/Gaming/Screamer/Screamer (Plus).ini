[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SIScreamer | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#CLI Arguments.inc
@include4=#@#Plus\Measures\Action Timer Icon.inc
@include5=#@#Plus\Gradient Shape Style.inc
@include6=#@#Plus\Mask Shape Style.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#ScreamerShape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | #ScreamerShapeGradient1Base#,#ShapeAlphaMask# ; 1.0 | #ScreamerShapeGradient2Base#,#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#ScreamerMaskMeter#
MeterStyle=FaderShapeActions | Mask#ScreamerMaskStyle##IconHeight#
Group=Faders
Hidden=#ScreamerRegularHidden#
MyMaskFillColor=Fill Color #ScreamerMaskBase#,#ShapeAlphaIcon#
ImageTint=#ScreamerMaskBase#
ImageAlpha=#ShapeAlphaIcon#

[Screamer]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\Screamer.png
ImageTint=#ScreamerMaskBase#
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#ScreamerURL#"#ScreamerCLI#]
AntiAlias=1
UpdateDivider=-1
