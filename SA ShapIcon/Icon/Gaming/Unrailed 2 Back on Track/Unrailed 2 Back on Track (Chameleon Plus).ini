[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SIUnrailed2 | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#CLI Arguments.inc
@include4=#@#Plus\Measures\Action Timer Icon.inc
@include5=#@#Plus\Gradient Shape Style.inc
@include6=#@#Plus\Mask Shape Style.inc
@include7=#@#Plus\Chameleon.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#Unrailed2Shape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | [Desktop#Unrailed2ShapeGradient1ChCode#],#ShapeAlphaMask# ; 1.0 | [Desktop#Unrailed2ShapeGradient2ChCode#],#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#Unrailed2MaskMeter#
MeterStyle=FaderShapeActions | Mask#Unrailed2MaskStyle##IconHeight#
Group=Faders
Hidden=#Unrailed2RegularHidden#
MyMaskFillColor=Fill Color [Desktop#Unrailed2MaskChCode#],#ShapeAlphaIcon#
ImageTint=[Desktop#Unrailed2MaskChCode#]
ImageAlpha=#ShapeAlphaIcon#

[Unrailed2]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\Unrailed 2 Back on Track.png
ImageTint=[Desktop#Unrailed2MaskChCode#]
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#Unrailed2URL#"#Unrailed2CLI#]
AntiAlias=1
UpdateDivider=-1
