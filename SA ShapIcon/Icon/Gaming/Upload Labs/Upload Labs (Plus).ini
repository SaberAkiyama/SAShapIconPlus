[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SIUploadLabs | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#CLI Arguments.inc
@include4=#@#Plus\Measures\Action Timer Icon.inc
@include5=#@#Plus\Gradient Shape Style.inc
@include6=#@#Plus\Mask Shape Style.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#UploadLabsShape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | #UploadLabsShapeGradient1Base#,#ShapeAlphaMask# ; 1.0 | #UploadLabsShapeGradient2Base#,#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#UploadLabsMaskMeter#
MeterStyle=FaderShapeActions | Mask#UploadLabsMaskStyle##IconHeight#
Group=Faders
Hidden=#UploadLabsRegularHidden#
MyMaskFillColor=Fill Color #UploadLabsMaskBase#,#ShapeAlphaIcon#
ImageTint=#UploadLabsMaskBase#
ImageAlpha=#ShapeAlphaIcon#

[UploadLabs]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\Upload Labs.png
ImageTint=#UploadLabsMaskBase#
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#UploadLabsURL#"#UploadLabsCLI#]
AntiAlias=1
UpdateDivider=-1
