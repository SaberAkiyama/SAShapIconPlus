[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SIValheim | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#CLI Arguments.inc
@include4=#@#Plus\Measures\Action Timer Icon.inc
@include5=#@#Plus\Gradient Shape Style.inc
@include6=#@#Plus\Mask Shape Style.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#ValheimShape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | #ValheimShapeGradient1Base#,#ShapeAlphaMask# ; 1.0 | #ValheimShapeGradient2Base#,#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#ValheimMaskMeter#
MeterStyle=FaderShapeActions | Mask#ValheimMaskStyle##IconHeight#
Group=Faders
Hidden=#ValheimRegularHidden#
MyMaskFillColor=Fill Color #ValheimMaskBase#,#ShapeAlphaIcon#
ImageTint=#ValheimMaskBase#
ImageAlpha=#ShapeAlphaIcon#

[Valheim]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\Valheim.png
ImageTint=#ValheimMaskBase#
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#ValheimURL#"#ValheimCLI#]
AntiAlias=1
UpdateDivider=-1
