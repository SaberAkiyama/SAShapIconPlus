[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SIXBOX | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#Plus\Measures\Action Timer Icon.inc
@include4=#@#Plus\Gradient Shape Style.inc
@include5=#@#Plus\Mask Shape Style.inc
@include6=#@#Plus\Chameleon.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#XBOXShape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | [Desktop#XBOXShapeGradient1ChCode#],#ShapeAlphaMask# ; 1.0 | [Desktop#XBOXShapeGradient2ChCode#],#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#XBOXMaskMeter#
MeterStyle=FaderShapeActions | Mask#XBOXMaskStyle##IconHeight#
Group=Faders
Hidden=#XBOXRegularHidden#
MyMaskFillColor=Fill Color [Desktop#XBOXMaskChCode#],#ShapeAlphaIcon#
ImageTint=[Desktop#XBOXMaskChCode#]
ImageAlpha=#ShapeAlphaIcon#

[XBOX]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\XBOX.png
ImageTint=[Desktop#XBOXMaskChCode#]
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#XBOXURL#"]
AntiAlias=1
UpdateDivider=-1
