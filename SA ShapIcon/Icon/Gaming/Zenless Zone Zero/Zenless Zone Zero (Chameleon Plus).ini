[Rainmeter]
Update=1000
DefaultUpdateDivider=-1
Group=SIZZZ | SIGaming | SIGradientAngle | SIIconSize | SITransparent | SISnapEdge

OnRefreshAction=[!FadeDuration "100"][!SnapEdges #SnapToggle#]

ContextTitle=Open Settings panel
ContextAction=[!ActivateConfig "#ROOTCONFIG#" "Settings (Plus).ini"]

[Variables]
@include=#@#Plus\Variables.inc
@include2=#@#File Locations.inc
@include3=#@#CLI Arguments.inc
@include4=#@#Plus\Measures\Action Timer Icon.inc
@include5=#@#Plus\Gradient Shape Style.inc
@include6=#@#Plus\Mask Shape Style.inc
@include7=#@#Plus\Chameleon.inc

[Mask]
Meter=Shape
MeterStyle=FaderShapeActions | Mask#ZZZShape##IconHeight#
Group=Faders
MyFillGradient=#ShapeGradientAngle# | [Desktop#ZZZShapeGradient1ChCode#],#ShapeAlphaMask# ; 1.0 | [Desktop#ZZZShapeGradient2ChCode#],#ShapeAlphaMask# ; 0.0

[Mask2]
Meter=#ZZZMaskMeter#
MeterStyle=FaderShapeActions | Mask#ZZZMaskStyle##IconHeight#
Group=Faders
Hidden=#ZZZRegularHidden#
MyMaskFillColor=Fill Color [Desktop#ZZZMaskChCode#],#ShapeAlphaIcon#
ImageTint=[Desktop#ZZZMaskChCode#]
ImageAlpha=#ShapeAlphaIcon#

[ZZZ]
Meter=Image
MeterStyle=FaderShapeActions
Group=Faders
ImageName=#@#Plus\Image Shapes\Icon\Gaming\Zenless Zone Zero.png
ImageTint=[Desktop#ZZZMaskChCode#]
ImageAlpha=#ShapeAlphaIcon#
H=#IconHeight#
LeftMouseUpAction=["#ZZZURL#"#ZZZCLI#]
AntiAlias=1
UpdateDivider=-1
